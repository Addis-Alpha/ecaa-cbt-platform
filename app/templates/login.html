{% extends "base.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}
<div class="login-card">

    <!--<img
        src="{{ url_for('static', filename='images/ecaa_logo.png') }}"
        class="login-logo"

    <h2>

    <p class="login-subtitle">
        <h1>Welcome</h1>
    <br>
        Please sign in to continue.
    </p>
    <br>
    <form method="POST">
        <div class="form-group">
            <label>
                Username or Examinee ID
            </label>

            <input
                name="username"
                placeholder="Enter your username or Examinee ID"
                required>
        </div>

        <div class="form-group">
            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                id="passwordInput"
                placeholder="Enter your password"
                required>
        </div>

        <button
            type="submit">
            Sign In
        </button>
    </form>
</div>

<style>
    
</style>

<script>
    function togglePasswordVisibility() {

        const input = document.getElementById("passwordInput");
        const checkbox = document.getElementById("showPasswordCheckbox");

        input.type = checkbox.checked ? "text" : "password";
    }
</script>
{% endblock %}
